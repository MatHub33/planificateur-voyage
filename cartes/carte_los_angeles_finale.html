<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌴 Los Angeles — Programme final</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1923; color: #fff; }
#header { background: linear-gradient(135deg, #1C3F6E 0%, #0f2a4a 100%); padding: 16px 20px; text-align: center; border-bottom: 2px solid #C8511B; }
#header h1 { font-size: 18px; font-weight: 700; }
#header p { font-size: 12px; opacity: 0.7; margin-top: 4px; }
#legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; background: #1a2a3a; border-bottom: 1px solid #2a3a4a; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#map { height: calc(100vh - 150px); width: 100%; }
.popup-title { font-size: 14px; font-weight: 700; color: #1C3F6E; margin-bottom: 6px; }
.popup-time { font-size: 12px; font-weight: 700; color: #C8511B; margin-bottom: 4px; }
.popup-desc { font-size: 12px; color: #333; line-height: 1.5; }
.leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-width: 270px; }
</style>
</head>
<body>
<div id="header"><h1>🌴 Los Angeles — Programme final</h1><p>Mathieu, Julie & Nohlan — 22 au 25 août 2026</p></div>
<div id="legend">
  <div class="leg"><div class="dot" style="background:#3b82f6"></div> Sam 22</div>
  <div class="leg"><div class="dot" style="background:#f97316"></div> Dim 23</div>
  <div class="leg"><div class="dot" style="background:#22c55e"></div> Lun 24</div>
  <div class="leg"><div class="dot" style="background:#a855f7"></div> Mar 25</div>
  <div class="leg"><div class="dot" style="background:#eab308"></div> 🟡 Choix</div>
  <div class="leg"><div class="dot" style="background:#9ca3af"></div> ⚪ Option</div>
  <div class="leg"><div class="dot" style="background:#ef4444"></div> 🏨 Hôtel</div>
</div>
<div id="map"></div>
<script>
const map = L.map('map', { center: [34.05, -118.55], zoom: 9, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
function mkIcon(color, label) {
  return L.divIcon({ className: '', html: `<div style="background:${color};color:white;font-size:10.5px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-weight:900">${label}</div>`, iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-13] });
}
function pop(title, time, desc) {
  return `<div class="popup-title">${title}</div>${time?`<div class="popup-time">🕐 ${time}</div>`:''}<div class="popup-desc">${desc}</div>`;
}

const HOTEL = [34.019200,-118.486600];
L.marker(HOTEL, {icon:mkIcon('#ef4444','🏨')}).addTo(map).bindPopup(pop("🏨 Santa Monica Hotel","22-26 août","2102 Lincoln Blvd."),{maxWidth:280});

const sam22 = [
  { latlng: [34.4216246,-119.6453242], n:"1 · Check-out hôtel Santa Barbara", t:"~9h00", d:"" },
  { latlng: [34.4231054,-119.7035993], n:"2 · State Street", t:"~9h45", d:"Architecture coloniale espagnole. 30-40 min" },
  { latlng: [34.0218023,-118.8311897], n:"3 · Zuma Beach (choix A)", t:"~12h15", d:"OU Point Dume (choix sur place). Point Dume = rando 30 min + vue + tide pools", c:'choice' },
  { latlng: [34.0016746,-118.8068986], n:"4 · Point Dume State Beach (choix B)", t:"~12h15", d:"OU Zuma Beach. Coordonnées vérifiées. A priori il n\'y a pas d\'endroits pour acheter à manger.", c:'choice' },
  { latlng: [34.0335749,-118.6804346], n:"5 · Malibu Lagoon State Beach (choix A)", t:"~14h30", d:"OU Malibu Pier — lagune/oiseaux, voisin immédiat", c:'choice' },
  { latlng: [34.0365277,-118.6761657], n:"6 · Malibu Pier + Surfrider Beach (choix B)", t:"~14h30", d:"OU Malibu Lagoon — jetée/surf, voisin immédiat", c:'choice' },
  { latlng: [34.0322000,-118.6772000], n:"7 · Carbon Beach", t:"", d:"5046 Carbon Beach Terr — \"Billionaire\'s Beach\", Malibu." },
  { latlng: [34.0118828,-118.4915504], n:"8 · Route → Santa Monica", t:"~15h15", d:"~25-30 min via Pacific Coast Highway (PCH)" },
  { latlng: [34.0107031,-118.4815299], n:"9 · Arrivée hôtel Santa Monica", t:"~16h00", d:"Check-in, dépôt bagages. Prix vélos à confirmer directement" },
  { latlng: [33.9860068,-118.4734180], n:"10 · Santa Monica Beach Basketball Courts", t:"~17h00", d:"Terrains en accès libre, juste après installation à l\'hôtel" },
  { latlng: [34.0090094,-118.4947640], n:"11 · Muscle Beach", t:"~18h30", d:"Structure historique de musculation en extérieur. Enchaîne vers le coucher de soleil" },
];
sam22.forEach(p => L.marker(p.latlng, {icon:mkIcon(p.c==='choice'?'#eab308':'#3b82f6', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline(sam22.filter(p=>p.c!=='choice').map(p=>p.latlng).concat([HOTEL]), {color:'#3b82f6',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const dim23 = [
  { latlng: [34.152200,-118.337600], n:"10 · Warner Bros Studio Tour", t:"9h00", d:"" },
  { latlng: [34.101700,-118.340600], n:"11 · Walk of Fame", t:"~13h15", d:"" },
  { latlng: [34.1020231,-118.3409712], n:"11b · TCL Chinese + Dolby Theatre", t:"~13h45", d:"" },
  { latlng: [34.1269448,-118.3261053], n:"12 · Lake Hollywood Park", t:"~14h30", d:"Coordonnées vérifiées." },
  { latlng: [34.0953673,-118.3723674], n:"13 · Sunset Strip", t:"~15h30", d:"Coordonnées vérifiées." },
];
dim23.forEach(p => L.marker(p.latlng, {icon:mkIcon('#f97316', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline(dim23.map(p=>p.latlng), {color:'#f97316',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const lun24 = [
  { latlng: [33.985000,-118.469500], n:"14 · Venice Beach Boardwalk", t:"Matin", d:"" },
  { latlng: [33.980800,-118.463600], n:"15 · Venice Canals", t:"Matin", d:"" },
  { latlng: [34.068900,-118.445200], n:"16 · UCLA Campus", t:"Après-midi", d:"" },
  { latlng: [34.068700,-118.400500], n:"17 · Beverly Hills / Rodeo Drive", t:"Après-midi", d:"" },
  { latlng: [34.0822095,-118.3823465], n:"18 · Pacific Design Center", t:"Après-midi", d:"Coordonnées vérifiées." },
  { latlng: [34.083941,-118.377500], n:"19 · Melrose Ave — Pink Wall", t:"Après-midi", d:"" },
  { latlng: [34.118400,-118.300400], n:"20 · Griffith Observatory", t:"Soir", d:"Vue uniquement." },
];
lun24.forEach(p => L.marker(p.latlng, {icon:mkIcon('#22c55e', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline([HOTEL].concat(lun24.map(p=>p.latlng)), {color:'#22c55e',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const mar25 = [
  { latlng: [34.0697195,-118.2544636], n:"1 · Maison \"Thriller\" MJ", t:"~9h00", d:"On arrive de l\'hôtel. ⚠️ 1345 Carroll Ave (corrigé — pas 1320). Deux portes après Charmed House." },
  { latlng: [34.0695060,-118.2539954], n:"2 · Charmed House", t:"9h10", d:"1329 Carroll Ave. 20 min avec la maison voisine." },
  { latlng: [34.0688772,-118.2516229], n:"3 · Maison \"Fast & Furious\"", t:"9h20", d:"" },
  { latlng: [34.0430175,-118.2672541], n:"4 · Crypto.com Arena", t:"~9h45", d:"Statue Kobe & Gianna. 30 min." },
  { latlng: [34.0507000,-118.2508000], n:"5 · Angels Flight Railway", t:"", d:"Funiculaire historique, Downtown LA." },
  { latlng: [34.0073187,-118.1529856], n:"6 · Citadel Outlets", t:"11h30", d:"Shopping + déjeuner sur place. 2h." },
  { latlng: [33.8358000,-118.3350000], n:"7 · Torrance High School", t:"", d:"2200 W Carson St. Lycée de Sunnydale (Buffy) + West Beverly (90210). Extérieur seulement, éviter en semaine scolaire." },
  { latlng: [34.0129033,-118.5017237], n:"8 · Santa Monica — plage", t:"~18h30", d:"Golden Hour." },
];
mar25.forEach(p => L.marker(p.latlng, {icon:mkIcon('#a855f7', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline([HOTEL].concat(mar25.map(p=>p.latlng)), {color:'#a855f7',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const options = [
  { latlng: [34.072300,-118.358300], n:"⚪ The Grove", d:"" },
  { latlng: [34.078100,-118.361100], n:"⚪ Pan Pacific Park", d:"" },
  { latlng: [34.115600,-118.144500], n:"⚪ Maison Space Jam", d:"" },
  { latlng: [33.945100,-118.343100], n:"⚪ Intuit Dome", d:"" },
];
options.forEach(p => L.marker(p.latlng, {icon:mkIcon('#9ca3af','⚪')}).addTo(map).bindPopup(pop(p.n,'Option',p.d),{maxWidth:280}));

map.fitBounds([[33.90,-119.75],[34.45,-118.10]]);
</script>
</body>
</html>
