<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 Highway 1 — Programme final</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1923; color: #fff; }
#header { background: linear-gradient(135deg, #1C3F6E 0%, #0f2a4a 100%); padding: 16px 20px; text-align: center; border-bottom: 2px solid #C8511B; }
#header h1 { font-size: 18px; font-weight: 700; }
#header p { font-size: 12px; opacity: 0.7; margin-top: 4px; }
#legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; background: #1a2a3a; border-bottom: 1px solid #2a3a4a; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#map { height: calc(100vh - 150px); width: 100%; }
.popup-title { font-size: 14px; font-weight: 700; color: #1C3F6E; margin-bottom: 6px; }
.popup-time { font-size: 12px; font-weight: 700; color: #C8511B; margin-bottom: 4px; }
.popup-desc { font-size: 12px; color: #333; line-height: 1.5; }
.leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-width: 270px; }
</style>
</head>
<body>
<div id="header"><h1>🌊 Highway 1 — Programme final</h1><p>Mathieu, Julie & Nohlan — 20 au 21 août 2026</p></div>
<div id="legend">
  <div class="leg"><div class="dot" style="background:#3b82f6"></div> Jeudi 20</div>
  <div class="leg"><div class="dot" style="background:#f97316"></div> Vendredi 21</div>
  <div class="leg"><div class="dot" style="background:#9ca3af"></div> ⚪ Option</div>
  <div class="leg"><div class="dot" style="background:#ef4444"></div> 🏨 Hôtels</div>
</div>
<div id="map"></div>
<script>
const map = L.map('map', { center: [36.3, -121.9], zoom: 9, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
function mkIcon(color, label) {
  return L.divIcon({ className: '', html: `<div style="background:${color};color:white;font-size:10.5px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-weight:900">${label}</div>`, iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-13] });
}
function pop(title, time, desc, link) {
  return `<div class="popup-title">${title}</div>${time?`<div class="popup-time">🕐 ${time}</div>`:''}<div class="popup-desc">${desc}</div>${link?`<div style="margin-top:8px"><a href="${link}" target="_blank" style="display:inline-block;background:#1C3F6E;color:white;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;text-decoration:none">📍 Ouvrir dans Google Maps</a></div>`:''}`;
}

const hotels = [
  { latlng: [36.6002,-121.8947], name:"🏨 Travelodge Monterey Bay", t:"Nuit — Jeudi 20", d:"" },
  { latlng: [34.4285,-119.6668], name:"🏨 Coast Village Inn", t:"Nuit — Vendredi 21", d:"Montecito." },
];
hotels.forEach(h => L.marker(h.latlng, {icon:mkIcon('#ef4444','🏨')}).addTo(map).bindPopup(pop(h.name,h.t,h.d),{maxWidth:280}));

const jeu20 = [
  { latlng: [37.7431549,-122.4147521], n:"1 · Bernal Heights Park (Option B)", t:"~8h20", d:"Sur la route, si le temps le permet.", opt:true },
  { latlng: [36.9642,-122.0466], n:"2 · Santa Cruz Boardwalk + Wharf", t:"10h00", d:"" },
  { latlng: [36.9784254,-121.9524524], n:"3 · Gayle's Bakery — courses pique-nique", t:"11h30", d:"504 Bay Ave, Capitola." },
  { latlng: [36.9752,-121.9530], n:"4 · Capitola Village", t:"11h50", d:"Pique-nique sur la plage." },
  { latlng: [36.6177,-121.8958], n:"5 · Cannery Row", t:"14h00", d:"" },
  { latlng: [36.6025,-121.8947], n:"6 · Monterey Wharf", t:"14h50", d:"" },
  { latlng: [36.5552,-121.9233], n:"7 · Carmel-by-the-Sea", t:"15h30", d:"2h avec marche et photos." },
];
jeu20.forEach(p => L.marker(p.latlng, {icon:mkIcon(p.opt?'#9ca3af':'#3b82f6', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline([hotels[0].latlng].concat(jeu20.filter(p=>!p.opt).map(p=>p.latlng)).concat([hotels[0].latlng]), {color:'#3b82f6',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const ven21 = [
  { latlng: [36.5977871,-121.8503884], n:"7 · Courses + essence — Safeway Monterey", t:"7h30", d:"Obligatoire — peu de commerces après Carmel." },
  { latlng: [36.5216283,-121.9527333], n:"8 · Point Lobos State Reserve", t:"8h00", d:"Coordonnées vérifiées." },
  { latlng: [36.3714835,-121.901924], n:"9 · Bixby Creek Bridge", t:"~9h30", d:"Vu en passant, sans détour." },
  { latlng: [36.1770363,-121.6937596], n:"10 · Partington Cove", t:"~10h15", d:"Tunnel dans la roche. 45 min A/R. Coordonnées vérifiées." },
  { latlng: [36.177,-121.673], n:"11 · Julia Pfeiffer Burns Vista Point", t:"10h30", d:"Sur la route, panoramas Big Sur Scenic Drive." },
  { latlng: [36.160056,-121.672639], n:"12 · McWay Falls", t:"11h00", d:"Seul accès gratuit — trail payant fermé.", link:"https://www.google.com/maps?q=36.160056,-121.672639" },
  { latlng: [35.3658,-120.8499], n:"13 · Morro Bay — arrêt photo", t:"15h40", d:"10-15 min max." },
  { latlng: [35.1428,-120.6413], n:"14 · Pismo Beach", t:"16h00", d:"Sur la route de toute façon. Partir 16h30 max." },
  { latlng: [34.4216246,-119.6453242], n:"15 · Arrivée hôtel — piscine", t:"18h00", d:"Coast Village Inn. Profiter de la piscine." },
];
ven21.forEach(p => L.marker(p.latlng, {icon:mkIcon(p.opt?'#9ca3af':'#f97316', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d,p.link),{maxWidth:280}));
L.polyline([hotels[0].latlng].concat(ven21.map(p=>p.latlng)).concat([hotels[1].latlng]), {color:'#f97316',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const options = [
  { latlng: [36.6258,-121.9165], n:"⚪ Lovers Point Beach", d:"631 Ocean View Blvd, Pacific Grove." },
  { latlng: [36.50317,-121.93845], n:"⚪ 105 CA-1, Carmel", d:"Point d'intérêt privé." },
];
options.forEach(p => L.marker(p.latlng, {icon:mkIcon('#9ca3af','⚪')}).addTo(map).bindPopup(pop(p.n,'Option',p.d),{maxWidth:280}));

map.fitBounds([[34.30,-122.10],[37.10,-121.30]]);
</script>
</body>
</html>
