<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 Highway 1 — Programme final</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1923; color: #fff; }
#header { background: linear-gradient(135deg, #1C3F6E 0%, #0f2a4a 100%); padding: 16px 20px; text-align: center; border-bottom: 2px solid #C8511B; }
#header h1 { font-size: 18px; font-weight: 700; }
#header p { font-size: 12px; opacity: 0.7; margin-top: 4px; }
#legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; background: #1a2a3a; border-bottom: 1px solid #2a3a4a; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#map { height: calc(100vh - 150px); width: 100%; }
.popup-title { font-size: 14px; font-weight: 700; color: #1C3F6E; margin-bottom: 6px; }
.popup-time { font-size: 12px; font-weight: 700; color: #C8511B; margin-bottom: 4px; }
.popup-desc { font-size: 12px; color: #333; line-height: 1.5; }
.leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-width: 270px; }
</style>
</head>
<body>
<div id="header"><h1>🌊 Highway 1 — Programme final</h1><p>Mathieu, Julie & Nohlan — 20 au 21 août 2026</p></div>
<div id="legend">
  <div class="leg"><div class="dot" style="background:#3b82f6"></div> Jeudi 20</div>
  <div class="leg"><div class="dot" style="background:#f97316"></div> Vendredi 21</div>
  <div class="leg"><div class="dot" style="background:#9ca3af"></div> ⚪ Option</div>
  <div class="leg"><div class="dot" style="background:#ef4444"></div> 🏨 Hôtels</div>
</div>
<div id="map"></div>
<script>
const map = L.map('map', { center: [36.3, -121.9], zoom: 9, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
function mkIcon(color, label) {
  return L.divIcon({ className: '', html: `<div style="background:${color};color:white;font-size:10.5px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-weight:900">${label}</div>`, iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-13] });
}
function pop(title, time, desc, link) {
  return `<div class="popup-title">${title}</div>${time?`<div class="popup-time">🕐 ${time}</div>`:''}<div class="popup-desc">${desc}</div>${link?`<div style="margin-top:8px"><a href="${link}" target="_blank" style="display:inline-block;background:#1C3F6E;color:white;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;text-decoration:none">📍 Ouvrir dans Google Maps</a></div>`:''}`;
}

const hotels = [
  { latlng: [36.6002,-121.8947], name:"🏨 Travelodge Monterey Bay", t:"Nuit — Jeudi 20", d:"" },
  { latlng: [34.4285,-119.6668], name:"🏨 Coast Village Inn", t:"Nuit — Vendredi 21", d:"Montecito." },
];
hotels.forEach(h => L.marker(h.latlng, {icon:mkIcon('#ef4444','🏨')}).addTo(map).bindPopup(pop(h.name,h.t,h.d),{maxWidth:280}));

const jeu20 = [
  { latlng: [37.7589534,-122.4210993], n:"1 · Nice Kicks — Valencia St", t:"", d:"Si on veut y aller, partir un peu plus tôt.  877 Valencia St, Mission District.", opt:true },
  { latlng: [37.7431549,-122.4147521], n:"2 · Bernal Heights Park (Option B — sur la route)", t:"~8h20", d:"Sur le trajet vers Santa Cruz, léger détour. Créneau souple ce jour-là (2h de marge avant Santa Cruz)", opt:true },
  { latlng: [36.9645218,-122.0166672], n:"3 · Santa Cruz Boardwalk + Wharf", t:"10h00", d:"Parking ~10$. Manèges, plage, lions de mer. Big Dipper (1924) + arcades. Incontournable pour Nohlan !", opt:false },
  { latlng: [36.9784254,-121.9524524], n:"4 · Gayle\'s Bakery — courses pique-nique", t:"11h30", d:"504 Bay Ave, Capitola. Sandwichs, clam chowder, potato salad. Référence absolue. Prévoyez snacks pour l\'APM", opt:false },
  { latlng: [36.9752283,-121.9532930], n:"5 · Capitola Village — pique-nique", t:"11h50", d:"Plus ancienne station balnéaire de Californie. Façades colorées, plage de sable", opt:false },
  { latlng: [36.6138456,-121.8984533], n:"6 · Cannery Row", t:"14h00", d:"Rue immortalisée par Steinbeck. Boutiques, restaurants, vue sur la baie de Monterey", opt:false },
  { latlng: [36.6037963,-121.8933703], n:"7 · Monterey Wharf", t:"14h50", d:"Lions de mer, pélicans, pêcheurs. Vue sur la baie", opt:false },
  { latlng: [36.5552386,-121.9232879], n:"8 · Carmel-by-the-Sea", t:"15h30", d:"Parking gratuit (souvent complet, tourner un peu). Village de conte de fées : cottages, galeries d\'art, Carmel Beach. Comptez 2h avec la marche, les ", opt:false },
  { latlng: [36.5951503,-121.8660009], n:"9 · Hôtel — Travelodge by Wyndham Monterey Bay", t:"~18h00", d:"2030 N Fremont St, Monterey. Check-in, dîner sur place ou food delivery, sans être pressés par l\'heure", opt:false },
];
jeu20.forEach(p => L.marker(p.latlng, {icon:mkIcon(p.opt?'#9ca3af':'#3b82f6', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d),{maxWidth:280}));
L.polyline([hotels[0].latlng].concat(jeu20.filter(p=>!p.opt).map(p=>p.latlng)).concat([hotels[0].latlng]), {color:'#3b82f6',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const ven21 = [
  { latlng: [36.5977871,-121.8503884], n:"1 · Courses + plein d\'essence à Monterey — OBLIGATOIRE", t:"7h30", d:"Pique-nique de midi sur la route — Big Sur a très peu de commerces après Carmel. Stations-service quasi absentes ensuite, prix prohibitifs : faire le ", opt:false },
  { latlng: [36.5216283,-121.9527333], n:"2 · Point Lobos State Reserve", t:"8h00", d:"10$/véhicule. Loutres de mer, oiseaux marins. Sentiers faciles pour Nohlan. ⚠️ Parking limité, arriver tôt. Ouvert 8h-19h, dernière entrée 18h30. Un s", opt:false },
  { latlng: [36.5031700,-121.9384500], n:"3 · Maison de Brad Pitt", t:"", d:"", opt:true },
  { latlng: [36.3714835,-121.9019240], n:"4 · Bixby Creek Bridge", t:"~9h30", d:"Plus d\'arrêt dédié — directement sur la route entre Point Lobos et Pfeiffer Big Sur. Coup d\'œil ou photo rapide sans détour", opt:false },
  { latlng: [36.1770363,-121.6937596], n:"5 · 🕳️ Partington Cove", t:"~10h15", d:"Tunnel dans la roche → crique protégée. Moins de monde, baleines & condors possibles. 45 min A/R", opt:true },
  { latlng: [36.1770000,-121.6730000], n:"6 · Julia Pfeiffer Burns State Park Vista Point", t:"10h30", d:"Sur la route, 📸 Big Sur Scenic Drive — panoramas Highway 1 = pur spectacle. Arrêts spontanés aux belvédères. Ne pas se presse", opt:false },
  { latlng: [36.1600560,-121.6726390], n:"7 · McWay Falls — vue depuis Highway 1", t:"11h00", d:"⚠️ L\'Overlook Trail payant du parc est FERMÉ depuis avril 2025 (travaux, prolongé en 2026) — c\'est actuellement le SEUL point de vue possible, gratu", opt:false },
  { latlng: [35.3694186,-120.8676799], n:"8 · 🚗 Route → Morro Bay 🪨 Morro Bay — arrêt photo", t:"15h40", d:"H1 puis H46. Si fatigués : couper par H46E après San Simeon → Highway 101 Vue rapide sur Morro Rock (576m) dès que possible.", opt:false },
  { latlng: [35.1427533,-120.6412827], n:"9 · Pismo Beach", t:"16h00", d:"Sur la route de toute façon. Il faut partir de Pismo Beach à 16h30 MAX", opt:true },
  { latlng: [34.4216246,-119.6453242], n:"10 · Arrivée à l\'hôtel", t:"18h00", d:"Depuis Pismo Beach. Profiter de la piscine", opt:false },
];
ven21.forEach(p => L.marker(p.latlng, {icon:mkIcon(p.opt?'#9ca3af':'#f97316', p.n.split(' ')[0])}).addTo(map).bindPopup(pop(p.n,p.t,p.d,p.link),{maxWidth:280}));
L.polyline([hotels[0].latlng].concat(ven21.map(p=>p.latlng)).concat([hotels[1].latlng]), {color:'#f97316',weight:3,opacity:0.75,dashArray:'8,4'}).addTo(map);

const options = [
  { latlng: [36.6258,-121.9165], n:"⚪ Lovers Point Beach", d:"631 Ocean View Blvd, Pacific Grove." },
  { latlng: [36.50317,-121.93845], n:"⚪ 105 CA-1, Carmel", d:"Point d'intérêt privé." },
];
options.forEach(p => L.marker(p.latlng, {icon:mkIcon('#9ca3af','⚪')}).addTo(map).bindPopup(pop(p.n,'Option',p.d),{maxWidth:280}));

map.fitBounds([[34.30,-122.10],[37.10,-121.30]]);
</script>
</body>
</html>
